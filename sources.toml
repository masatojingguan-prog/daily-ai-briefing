# 収集対象のフィード一覧。category は要約時のヒントとして Claude に渡される。
# 追加・削除は自由。RSS / Atom であれば何でも可。

[settings]
hours_back = 26          # 何時間前までの記事を対象にするか（cron の遅延を考慮して少し長め）
max_items_per_feed = 15  # 1フィードあたりの最大件数
summary_chars = 400      # 各記事の本文抜粋の最大文字数

