name: Daily AI Briefing

on:
  schedule:
    # 毎朝 6:23 JST（= 21:23 UTC 前日）。GitHub の cron は混雑する毎時 0 分を避けないと
    # 遅延・スキップされやすいため半端な分にし、遅れても 7 時台には届くよう早めにしている
    - cron: "23 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せずにログへ出力する"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, summarize and post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python -m briefing.main ${{ inputs.dry_run && '--dry-run' || '' }}
