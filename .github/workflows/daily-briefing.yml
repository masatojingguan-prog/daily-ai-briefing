name: Daily AI Briefing
run-name: ${{ inputs.dry_run && 'Daily AI Briefing (dry run)' || 'Daily AI Briefing' }}

on:
  # 決まった時刻の配信は外部スケジューラ（cron-job.org）から workflow_dispatch で起動する。
  # GitHub の schedule は混雑で数時間遅れることがあるため、外部起動が来なかった日の予備として残す
  # （UTC 指定。21:23 UTC = 6:23 JST。その日すでに配信済みなら何もしない）
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せずにログへ出力する"
        type: boolean
        default: false
      force:
        description: "今日すでに配信済みでも配信する"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# 外部起動と予備の schedule が重なっても同時に走らせず、後のほうは配信済みチェックで止める
concurrency:
  group: daily-briefing

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      delivered: ${{ steps.check.outputs.delivered }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_CHECK: ${{ inputs.dry_run || inputs.force }}
        run: |
          if [ "$SKIP_CHECK" = "true" ]; then
            echo "delivered=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 朝の配信なので 6:00 JST より前は起動されても何もしない
          # （日付が変わった直後の 0 時台に配信・失敗通知が飛ぶのを防ぐ）
          hour=$(TZ=Asia/Tokyo date +%-H)
          if [ "$hour" -lt 6 ]; then
            echo "6:00 JST より前（現在 ${hour} 時台）のため配信しません"
            echo "delivered=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 直前の実行が終わった直後だと、API 上の結果（success）の反映が間に合わないことがあるので少し待つ
          sleep 20
          since=$(TZ=Asia/Tokyo date +%Y-%m-%dT00:00:00+09:00)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w daily-briefing.yml -s success \
                --created ">=$since" --json displayTitle \
                -q '[.[] | select(.displayTitle == "Daily AI Briefing")] | length')
          echo "今日（$since 以降）の配信済み回数: $n"
          echo "delivered=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  briefing:
    needs: guard
    if: needs.guard.outputs.delivered != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, summarize and post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python -m briefing.main ${{ inputs.dry_run && '--dry-run' || '' }}
